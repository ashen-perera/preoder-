<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asoka Vidyalaya Science Association - T-Shirt Pre-Order</title>
  <style>
    :root {
      --primary-color: #0b1d3a; /* Dark Navy Blue matching the t-shirt */
      --accent-color: #1e88e5;
      --bg-color: #f0f4f8;
      --text-color: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .main-wrapper {
      display: flex;
      flex-direction: row;
      background: white;
      max-width: 900px;
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* Left Side: Info & Size Chart */
    .info-section {
      flex: 1;
      background: #fafbfc;
      padding: 30px;
      border-right: 1px solid #eaeaea;
    }

    .info-section h3 {
      color: var(--primary-color);
      margin-top: 0;
      font-size: 20px;
    }

    .tshirt-preview {
      text-align: center;
      margin-bottom: 20px;
    }

    .tshirt-preview img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .size-chart {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 14px;
    }

    .size-chart th, .size-chart td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    .size-chart th {
      background-color: var(--primary-color);
      color: white;
    }

    /* Right Side: Form Section */
    .form-section {
      flex: 1;
      padding: 30px;
    }

    .form-section h2 {
      color: var(--primary-color);
      margin-top: 0;
      font-size: 22px;
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
      color: #444;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }

    button:hover {
      background-color: #15325c;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      font-size: 14px;
    }

    /* Responsive design for mobile screens */
    @media (max-width: 768px) {
      .main-wrapper {
        flex-direction: column;
      }
      .info-section {
        border-right: none;
        border-bottom: 1px solid #eaeaea;
      }
      body {
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <!-- Left Column: Design & Size Chart -->
    <div class="info-section">
      <h3>Official Pre-Order</h3>
      <div class="tshirt-preview">
        <!-- Design image preview -->
        <img src="255613_800cda.jpg" alt="Asoka Vidyalaya Science Association T-Shirt"[cite: 1]>
      </div>
      
      <h3>Size Guide (Inches)</h3>
      <table class="size-chart">
        <tr>
          <th>Size</th>
          <th>Chest</th>
          <th>Length</th>
        </tr>
        <tr><td>S</td><td>36"</td><td>26"</td></tr>
        <tr><td>M</td><td>38"</td><td>27"</td></tr>
        <tr><td>L</td><td>40"</td><td>28"</td></tr>
        <tr><td>XL</td><td>42"</td><td>29"</td></tr>
        <tr><td>XXL</td><td>44"</td><td>30"</td></tr>
      </table>
    </div>

    <!-- Right Column: Pre-Order Form -->
    <div class="form-section">
      <h2>T-Shirt Pre-Order</h2>
      <form id="order-form">
        <div class="form-group">
          <label>Full Name:</label>
          <input type="text" id="fullName" required placeholder="Enter your full name">
        </div>
        <div class="form-group">
          <label>Email Address (For Confirmation):</label>
          <input type="email" id="email" required placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label>Class / Index No:</label>
          <input type="text" id="studentId" required placeholder="e.g. 13-A / 4521">
        </div>
        <div class="form-group">
          <label>T-Shirt Size:</label>
          <select id="size" required>
            <option value="" disabled selected>Select your size</option>
            <option value="S">Small (S)</option>
            <option value="M">Medium (M)</option>
            <option value="L">Large (L)</option>
            <option value="XL">Extra Large (XL)</option>
            <option value="XXL">XXL</option>
          </select>
        </div>
        <button type="submit" id="sub-btn">Submit Pre-Order</button>
      </form>
      <p id="status"></p>
    </div>
  </div>

  <script>
    // ⚠️ Google Apps Script එකෙන් ලැබුණු Web App URL එක මෙතනට දාන්න:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxW4o9J72KXWbpsmqSYD091AA1lxQ8vCpTJbBQLhRRoDycIz0mfLzjQSZEEDFw_ktCldw/exec";

    document.getElementById('order-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('sub-btn');
      const status = document.getElementById('status');
      
      btn.disabled = true;
      btn.textContent = "Submitting Order...";
      status.style.color = "#1e88e5";
      status.textContent = "Please wait, saving your pre-order...";

      const payload = {
        fullName: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        studentId: document.getElementById('studentId').value,
        size: document.getElementById('size').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        status.style.color = "green";
        status.textContent = "Pre-order placed successfully! Confirmation email sent. 🎉";
        document.getElementById('order-form').reset();
      })
      .catch(err => {
        status.style.color = "red";
        status.textContent = "Something went wrong. Please try again!";
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = "Submit Pre-Order";
      });
    });
  </script>
</body>
</html>
